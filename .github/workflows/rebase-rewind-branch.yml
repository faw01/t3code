name: rebase-rewind-onto-main

on:
  push:
    branches:
      - seed/rebase-11721
    paths:
      - ".github/workflows/rebase-rewind-branch.yml"

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Force-push rebased commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: c79a7d912d56fb3f0eaf9b93509cb6f40b80fae0
        run: |
          python3 <<'PY'
          import base64, json, os, subprocess, traceback, urllib.error, urllib.request
          TOKEN = os.environ["GITHUB_TOKEN"]
          SHA = os.environ["SHA"]
          API = "https://api.github.com"
          FORK = "faw01/t3code"
          lines = []

          def log(m):
              print(m, flush=True)
              lines.append(m)

          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "rebase-11721",
                  },
              )
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      parsed = json.loads(raw) if raw else {}
                      log(f"{method} {path} -> {resp.status} {json.dumps(parsed)[:500]}")
                      return parsed
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", "replace")
                  log(f"{method} {path} -> {e.code} {err}")
                  return {"_error": e.code, "_body": err}

          def scrub(s):
              return s.replace(TOKEN, "***")

          def run(cmd):
              log("$ " + " ".join(scrub(c) for c in cmd))
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.stdout:
                  log(scrub(p.stdout))
              if p.stderr:
                  log(scrub(p.stderr))
              log(f"exit {p.returncode}")
              return p.returncode

          def upload():
              text = "\n".join(lines) + "\n"
              payload = {
                  "message": "chore: rebase debug log",
                  "content": base64.b64encode(text.encode()).decode(),
                  "branch": "seed/rebase-11721",
              }
              try:
                  existing = api("GET", f"/repos/{FORK}/contents/.github/patches/last-rebase-log.txt?ref=seed/rebase-11721")
                  if "sha" in existing:
                      payload["sha"] = existing["sha"]
              except Exception:
                  pass
              api("PUT", f"/repos/{FORK}/contents/.github/patches/last-rebase-log.txt", payload)

          ok = False
          try:
              api("GET", f"/repos/{FORK}/commits/{SHA}")
              created = api("POST", f"/repos/{FORK}/git/refs", {"ref": "refs/heads/tmp/rebased-11721", "sha": SHA})
              if created.get("_error"):
                  api("PATCH", "/repos/faw01/t3code/git/refs/heads/tmp/rebased-11721", {"sha": SHA, "force": True})
              run(["git", "config", "--global", "--unset-all", "http.https://github.com/.extraheader"])
              run(["git", "init", "--bare", "/tmp/bare.git"])
              run(["git", "-C", "/tmp/bare.git", "remote", "add", "origin", f"https://x-access-token:{TOKEN}@github.com/faw01/t3code.git"])
              run(["git", "-C", "/tmp/bare.git", "fetch", "--depth", "1", "origin", "tmp/rebased-11721"])
              rc = run(["git", "-C", "/tmp/bare.git", "push", "--force", "origin", f"{SHA}:refs/heads/fix/claude-rewind-history-worker"])
              if rc != 0:
                  rc = run(["git", "-C", "/tmp/bare.git", "push", "--force", "origin", "refs/remotes/origin/tmp/rebased-11721:refs/heads/fix/claude-rewind-history-worker"])
              if rc != 0:
                  rc = run(["git", "-C", "/tmp/bare.git", "push", "--force", "origin", "FETCH_HEAD:refs/heads/fix/claude-rewind-history-worker"])
              patched = api("PATCH", "/repos/faw01/t3code/git/refs/heads/fix/claude-rewind-history-worker", {"sha": SHA, "force": True})
              encoded = api("PATCH", "/repos/faw01/t3code/git/refs/heads%2Ffix%2Fclaude-rewind-history-worker", {"sha": SHA, "force": True})
              put = api("POST", "/repos/faw01/t3code/git/refs", {"ref": "refs/heads/fix/claude-rewind-history-worker", "sha": SHA})
              ref = api("GET", f"/repos/{FORK}/git/ref/heads/fix/claude-rewind-history-worker")
              log(f"final ref {ref}")
              current = (ref.get("object") or {}).get("sha")
              ok = current == SHA
              if not ok:
                  raise SystemExit(f"ref still {current}")
              log("SUCCESS")
          except BaseException:
              log(traceback.format_exc())
              upload()
              raise
          upload()
          PY
