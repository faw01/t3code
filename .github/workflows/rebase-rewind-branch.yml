name: rebase-rewind-onto-main

on:
  push:
    branches:
      - seed/rebase-11721
    paths:
      - ".github/workflows/rebase-rewind-branch.yml"

permissions:
  contents: write
  workflows: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Replay commit locally and force-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, traceback, urllib.error, urllib.request
          from pathlib import Path

          TOKEN = os.environ["GITHUB_TOKEN"]
          API = "https://api.github.com"
          FORK = "faw01/t3code"
          UPSTREAM = "pingdotgg/t3code"
          BRANCH = "fix/claude-rewind-history-worker"
          SEED = "seed/rebase-11721"
          PATCH_MD5 = "6cffe5bedad2d97e6f59cffeb70557b1"
          PATHS = [
              "apps/server/src/provider/Layers/ClaudeAdapter.ts",
              "apps/server/src/provider/Layers/ClaudeAdapter.test.ts",
          ]
          lines = []

          def log(m):
              print(m, flush=True)
              lines.append(m)

          def scrub(s):
              return s.replace(TOKEN, "***")

          def api(method, path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  API + path,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "rebase-11721",
                  },
              )
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      parsed = json.loads(raw) if raw else {}
                      log(f"API {method} {path} -> {resp.status}")
                      return parsed
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8", "replace")
                  log(f"API {method} {path} -> {e.code} {err[:300]}")
                  raise

          def download(url):
              req = urllib.request.Request(url, headers={"User-Agent": "rebase-11721"})
              with urllib.request.urlopen(req) as resp:
                  return resp.read()

          def run(cmd, cwd=None, check=True):
              log("$ " + " ".join(scrub(c) for c in cmd))
              p = subprocess.run(cmd, cwd=cwd, capture_output=True, text=True)
              if p.stdout.strip():
                  log(scrub(p.stdout.rstrip()))
              if p.stderr.strip():
                  log(scrub(p.stderr.rstrip()))
              log(f"exit {p.returncode}")
              if check and p.returncode != 0:
                  raise SystemExit(p.returncode)
              return p

          def upload():
              text = "\n".join(lines) + "\n"
              payload = {
                  "message": "chore: rebase debug log",
                  "content": base64.b64encode(text.encode()).decode(),
                  "branch": SEED,
              }
              try:
                  existing = api("GET", f"/repos/{FORK}/contents/.github/patches/last-rebase-log.txt?ref={SEED}")
                  payload["sha"] = existing["sha"]
              except Exception:
                  pass
              try:
                  api("PUT", f"/repos/{FORK}/contents/.github/patches/last-rebase-log.txt", payload)
              except Exception as e:
                  log(f"upload failed: {e}")

          try:
              main = api("GET", f"/repos/{UPSTREAM}/commits/main")
              main_sha = main["sha"]
              log(f"main={main_sha}")

              parts = b"".join(
                  download(f"https://raw.githubusercontent.com/{FORK}/{SEED}/.github/patches/claude-rollback.b64.{i}")
                  for i in range(4)
              )
              patch = base64.b64decode(parts.replace(b"\n", b""))
              digest = hashlib.md5(patch).hexdigest()
              log(f"patch md5={digest}")
              if digest != PATCH_MD5:
                  raise SystemExit("patch md5 mismatch")
              message = download(
                  f"https://raw.githubusercontent.com/{FORK}/{SEED}/.github/patches/rewind-commit-message.txt"
              ).decode()
              if not message.endswith("\n"):
                  message += "\n"

              work = Path(tempfile.mkdtemp())
              run(["git", "config", "--global", "--unset-all", "http.https://github.com/.extraheader"], check=False)
              run(["git", "init", str(work)])
              run(["git", "-C", str(work), "config", "user.name", "faw"])
              run(["git", "-C", str(work), "config", "user.email", "fawwad30@gmail.com"])
              run(["git", "-C", str(work), "remote", "add", "ping", f"https://github.com/{UPSTREAM}.git"])
              run([
                  "git", "-C", str(work), "-c", "protocol.version=2",
                  "fetch", "--depth", "1", "--filter=blob:none", "--no-tags", "ping", "main",
              ])
              fetched = run(["git", "-C", str(work), "rev-parse", "FETCH_HEAD"]).stdout.strip()
              log(f"FETCH_HEAD={fetched}")
              if fetched != main_sha:
                  raise SystemExit(f"fetched {fetched} != {main_sha}")
              run(["git", "-C", str(work), "read-tree", "FETCH_HEAD"])

              for rel in PATHS:
                  dest = work / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(download(f"https://raw.githubusercontent.com/{UPSTREAM}/{main_sha}/{rel}"))
              (work / "claude-rollback.patch").write_bytes(patch)
              run(["git", "apply", "--verbose", "claude-rollback.patch"], cwd=str(work))
              run(["git", "-C", str(work), "update-index", "--add", "--"] + PATHS)
              tree = run(["git", "-C", str(work), "write-tree"]).stdout.strip()
              log(f"tree={tree}")
              msg_path = work / "msg.txt"
              msg_path.write_text(message)
              env = os.environ.copy()
              env.update({
                  "GIT_AUTHOR_NAME": "faw",
                  "GIT_AUTHOR_EMAIL": "fawwad30@gmail.com",
                  "GIT_COMMITTER_NAME": "faw",
                  "GIT_COMMITTER_EMAIL": "fawwad30@gmail.com",
              })
              commit = subprocess.run(
                  ["git", "commit-tree", tree, "-p", fetched, "-F", str(msg_path)],
                  cwd=str(work),
                  capture_output=True,
                  text=True,
                  env=env,
                  check=True,
              ).stdout.strip()
              log(f"commit={commit}")
              run(["git", "-C", str(work), "log", "-1", "--format=%H%n%P%n%s", commit])
              run(["git", "-C", str(work), "remote", "add", "fork", f"https://x-access-token:{TOKEN}@github.com/{FORK}.git"])
              push = run(
                  ["git", "-C", str(work), "push", "--force", "fork", f"{commit}:refs/heads/{BRANCH}"],
                  check=False,
              )
              if push.returncode != 0:
                  alt = run(
                      ["git", "-C", str(work), "push", "--force", "fork", f"{commit}:refs/heads/tmp/rebased-11721"],
                      check=False,
                  )
                  log(f"tmp push exit {alt.returncode}")
                  raise SystemExit("force-push to PR branch failed")
              ref = api("GET", f"/repos/{FORK}/git/ref/heads/{BRANCH}")
              current = ref["object"]["sha"]
              log(f"ref={current}")
              if current != commit:
                  raise SystemExit(f"ref {current} != {commit}")
              pr = api("GET", f"/repos/{UPSTREAM}/pulls/11721")
              log(f"PR commits={pr.get('commits')} files={pr.get('changed_files')} head={pr.get('head', {}).get('sha')}")
              log("SUCCESS")
          except BaseException:
              log(traceback.format_exc())
              upload()
              raise
          upload()
          PY
