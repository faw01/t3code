name: rebase-rewind-onto-main

on:
  push:
    branches:
      - seed/rebase-11721
    paths:
      - ".github/workflows/rebase-rewind-branch.yml"

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Force-push rebased commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: c79a7d912d56fb3f0eaf9b93509cb6f40b80fae0
        run: |
          set -euxo pipefail
          git config --global --unset-all http.https://github.com/.extraheader || true
          git init --bare /tmp/bare.git
          git -C /tmp/bare.git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/faw01/t3code.git"
          git -C /tmp/bare.git fetch --depth 1 origin "$SHA"
          git -C /tmp/bare.git rev-parse FETCH_HEAD
          git -C /tmp/bare.git log -1 --format='%H %P %s' FETCH_HEAD
          git -C /tmp/bare.git push --force origin "${SHA}:refs/heads/fix/claude-rewind-history-worker"
          echo SUCCESS
