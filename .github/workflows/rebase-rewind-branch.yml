name: rebase-rewind-onto-main

on:
  push:
    branches:
      - seed/rebase-11721

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: seed
          fetch-depth: 1
          persist-credentials: false
      - name: Replay one-commit fix onto current pingdotgg main
        run: |
          set -euxo pipefail
          git config --global --unset-all http.https://github.com/.extraheader || true
          cat seed/.github/patches/claude-rollback.b64.0 \
              seed/.github/patches/claude-rollback.b64.1 \
              seed/.github/patches/claude-rollback.b64.2 \
              seed/.github/patches/claude-rollback.b64.3 \
            | tr -d '\n' | base64 -d > /tmp/claude-rollback.patch
          test "$(md5sum /tmp/claude-rollback.patch | awk '{print $1}')" = 6cffe5bedad2d97e6f59cffeb70557b1
          git clone --depth 1 https://github.com/pingdotgg/t3code.git work
          cd work
          git config user.name faw
          git config user.email fawwad30@gmail.com
          git apply /tmp/claude-rollback.patch
          git add \
            apps/server/src/provider/Layers/ClaudeAdapter.ts \
            apps/server/src/provider/Layers/ClaudeAdapter.test.ts
          git commit --author="faw <fawwad30@gmail.com>" -F ../seed/.github/patches/rewind-commit-message.txt
          git rev-parse HEAD
          git log -1 --format='%H %P %s'
          git diff --stat HEAD~1
          git remote add fork "https://x-access-token:${GITHUB_TOKEN}@github.com/faw01/t3code.git"
          git push --force fork HEAD:refs/heads/fix/claude-rewind-history-worker
